<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <meta name="robots" content="noindex, nofollow">
  <title>404 · Page Not Found | Online Wheel</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      --bg: #111318;
      --surface: #1a1d24;
      --line: #2c313c;
      --text: #eceef2;
      --muted: #9097a6;
      --accent: #ffb400;
      --accent-ink: #1a1400;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(255,180,0,.09), transparent 42%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
    }
    .error { width: min(100%, 560px); position: relative; }
    .wheel {
      width: 76px; height: 76px; margin: 0 auto 22px;
      border-radius: 50%;
      border: 7px solid var(--accent);
      background: conic-gradient(#e8503a 0 45deg, #f28c28 45deg 90deg,
        #f5c518 90deg 135deg, #2fa84f 135deg 180deg,
        #1f9bd1 180deg 225deg, #5b5fcf 225deg 270deg,
        #a64fc0 270deg 315deg, #e04a8f 315deg 360deg);
      box-shadow: 0 0 40px rgba(255,180,0,.14);
      position: relative;
    }
    .wheel::after {
      content: ""; position: absolute; width: 17px; height: 17px;
      border-radius: 50%; background: #fff; border: 4px solid var(--bg);
      top: 50%; left: 50%; transform: translate(-50%,-50%);
    }
    .code {
      color: var(--accent); font-size: clamp(5rem, 19vw, 8.5rem);
      line-height: .95; letter-spacing: -.075em; font-weight: 900;
      text-shadow: 0 8px 40px rgba(255,180,0,.12);
    }
    h1 { margin: 20px 0 10px; font-size: clamp(1.55rem, 5vw, 2.15rem); letter-spacing: -.035em; }
    p { margin: 0 auto; max-width: 410px; color: var(--muted); line-height: 1.7; font-size: 1rem; }
    .path {
      display: inline-block; max-width: 100%; overflow-wrap: anywhere;
      margin-top: 20px; padding: 8px 12px; border: 1px solid var(--line);
      border-radius: 8px; background: var(--surface); color: #b7bdc9;
      font:  .85rem ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .actions { margin-top: 28px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    a {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 46px; padding: 0 19px; border-radius: 10px;
      text-decoration: none; font-weight: 750; transition: transform .15s, filter .15s;
    }
    a:hover { transform: translateY(-2px); }
    .primary { color: var(--accent-ink); background: var(--accent); }
    .secondary { color: var(--text); background: var(--surface); border: 1px solid var(--line); }
    .footer { margin-top: 48px; color: #626a79; font-size: .78rem; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main class="error">
    <div class="wheel" aria-hidden="true"></div>
    <div class="code">404</div>
    <h1>Oops! Page not found</h1>
    <p>The page you're looking for doesn't exist, may have been moved, or the address was entered incorrectly.</p>
    <div class="path" id="requested-path"></div>
    <div class="actions">
      <a class="primary" href="/">Back to Homepage <span aria-hidden="true">&nbsp;→</span></a>
      <a class="secondary" href="/de.html">Deutsch</a>
    </div>
    <div class="footer">ONLINE WHEEL</div>
  </main>
  <script>
    document.getElementById("requested-path").textContent = window.location.pathname;
  </script>
</body>
</html>
